<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Management Partners — Direct Off Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/investor.css">
<link rel="stylesheet" href="/css/glass.css">
  <script>
  (function() {
    var saved = localStorage.getItem('dom_portal_theme');
    var sessionSet = sessionStorage.getItem('dom_theme_session');
    var t = sessionSet ? (document.documentElement.getAttribute('data-theme') || saved || 'light') : (saved || 'light');
    if (!sessionSet) sessionStorage.setItem('dom_theme_session', '1');
    document.documentElement.setAttribute('data-theme', t);
  })();
  </script>
  <style>
    .page-wrap { margin-top: 70px; min-height: calc(100vh - 70px); display: flex; flex-direction: column; }
    .ph-body {
      flex: 1;
      max-width: 680px;
      margin: 0 auto;
      padding: 80px 24px 80px;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .ph-icon {
      width: 64px; height: 64px;
      border-radius: 16px;
      background: rgba(79,195,247,0.1);
      border: 1px solid rgba(79,195,247,0.18);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 28px;
    }
    .ph-icon svg { stroke: var(--accent); }
    .ph-eyebrow {
      display: inline-block;
      background: rgba(79,195,247,0.12);
      border: 1px solid rgba(79,195,247,0.25);
      color: var(--accent);
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.1em;
      padding: 4px 12px; border-radius: 20px; margin-bottom: 16px;
    }
    .ph-body h1 { font-size: 36px; font-weight: 800; color: var(--text); margin-bottom: 16px; line-height: 1.2; }
    .ph-body p { font-size: 16px; color: var(--text-muted); line-height: 1.7; margin-bottom: 36px; max-width: 420px; }
    .ph-back {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border);
      font-size: 14px; font-weight: 700;
      padding: 11px 22px; border-radius: 8px; text-decoration: none;
      font-family: inherit; transition: border-color 0.2s, color 0.2s;
    }
    .ph-back:hover { border-color: var(--accent); color: var(--accent); }
    @media (max-width: 580px) { .ph-body h1 { font-size: 28px; } }
  </style>
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16.png">
</head>
<body>
<div class="scene s-dark"></div>
<div class="scene s-light"></div>
<div class="depth"></div>
  <nav id="investorNav" class="investor-nav">
    <button class="pin-menu-btn" onclick="Portal.openPinMenu()" aria-label="Site menu">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect y="2" width="18" height="2" rx="1" fill="currentColor"/><rect y="8" width="18" height="2" rx="1" fill="currentColor"/><rect y="14" width="18" height="2" rx="1" fill="currentColor"/></svg>
    </button>
    <a class='nav-brand' href='/homepage'>
      <img src="/img/dom-logo-white.png" alt="Direct Off Market" style="height:28px;width:auto;max-width:130px;object-fit:contain;vertical-align:middle;">
    </a>
    <div class="nav-right" id="navRight" style="margin-left:auto;min-width:44px;"></div>
  </nav>

  <div class="page-wrap">
    <div class="ph-body">
      <div class="ph-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
        </svg>
      </div>
      <div class="ph-eyebrow">Coming Soon</div>
      <h1>Property Management</h1>
      <p>We're onboarding our first Property Management partners. Check back soon.</p>
      <a href="/preferred-partners.html" class="ph-back">&#8592; Back to Preferred Partners</a>
    </div>
  </div>

  <footer class="portal-footer">
    <div class="footer-links">
      <a href='/marketplace'>Marketplace</a>
      <a href='/dashboard'>Dashboard</a>
      <a href='/faq'>FAQ</a>
      <a href='/contact'>Contact</a>
      <a href='/privacy'>Privacy Policy</a>
    </div>
    <p>&copy; <span id="footerYear"></span> Direct Off Market LLC. All rights reserved.</p>
  </footer>

  <div id="portalToast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/investor-auth.js"></script>
  <script>
  document.getElementById('footerYear').textContent = new Date().getFullYear();

  (async function() {
    const session = await Portal.requireAuth();
    if (!session) return;
    await Portal.renderNav();
  })();
  </script>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F2F7FB"/>
    <stop offset="1" stop-color="#7C8E9C"/>
  </linearGradient>
</defs></svg>
</body>
</html>
