<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direct Off Market | Investor Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/investor.css">
  <script>
  (function() {
    var t = localStorage.getItem('dom_portal_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
  </script>
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16.png">
  <link rel="apple-touch-icon" href="/img/favicon-32.png">
</head>
<body>
  <div class="lg-mesh" aria-hidden="true"></div>
  <div class="index-loading">
    <img src="/img/dom-icon.gif" alt="Direct Off Market" style="width:96px;height:96px;object-fit:contain;">
    <p style="color:var(--text-muted);font-size:13px;font-weight:500;letter-spacing:0.04em;">Loading portal...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/investor-auth.js"></script>
  <div id="portalToast"></div>
  <script>
  (async function() {
    try {
      const session = await Portal.getSession();
      if (session) {
        window.location.href = '/marketplace.html';
      } else {
        window.location.href = '/homepage.html';
      }
    } catch (e) {
      // If anything goes wrong, fall back to homepage
      window.location.href = '/homepage.html';
    }
  })();
  </script>

  <script>
  // v2.3.0 Liquid Glass — slider indicator positioner
  (function() {
    function positionAll() {
      document.querySelectorAll('.lg-pill-row').forEach(function(row) {
        var active = row.querySelector(
          '.active, .accent, [aria-selected="true"], [data-active="true"]'
        );
        if (!active) {
          row.style.setProperty('--lg-indicator-opacity', '0');
          return;
        }
        var rect = row.getBoundingClientRect();
        var aRect = active.getBoundingClientRect();
        var left = aRect.left - rect.left;
        var width = aRect.width;
        row.style.setProperty('--lg-indicator-left', left + 'px');
        row.style.setProperty('--lg-indicator-width', width + 'px');
        row.style.setProperty('--lg-indicator-opacity', '1');
      });
    }
    var ro = new ResizeObserver(positionAll);
    document.querySelectorAll('.lg-pill-row').forEach(function(row) {
      ro.observe(row);
      row.addEventListener('click', function() { requestAnimationFrame(positionAll); });
    });
    // MutationObserver catches class toggles done by other scripts
    var mo = new MutationObserver(positionAll);
    document.querySelectorAll('.lg-pill-row').forEach(function(row) {
      mo.observe(row, { subtree: true, attributes: true, attributeFilter: ['class', 'aria-selected', 'data-active'] });
    });
    window.addEventListener('load', positionAll);
    window.addEventListener('resize', positionAll);
    document.addEventListener('DOMContentLoaded', positionAll);
    // Defer one more frame so any inline scripts that toggle .active on load have run
    setTimeout(positionAll, 0);
  })();
  </script>
</body>
</html>
