<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direct Off Market | Investor Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/investor.css">
  <script>
  (function() {
    var t = localStorage.getItem('dom_portal_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
  </script>
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16.png">
  <link rel="apple-touch-icon" href="/img/favicon-32.png">
</head>
<body>
  <div class="index-loading">
    <img src="/img/dom-icon.gif" alt="Direct Off Market" style="width:96px;height:96px;object-fit:contain;">
    <p style="color:var(--text-muted);font-size:13px;font-weight:500;letter-spacing:0.04em;">Loading portal...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/investor-auth.js"></script>
  <div id="portalToast"></div>
  <script>
  (async function() {
    try {
      const session = await Portal.getSession();
      if (session) {
        window.location.href = '/marketplace.html';
      } else {
        window.location.href = '/homepage.html';
      }
    } catch (e) {
      // If anything goes wrong, fall back to homepage
      window.location.href = '/homepage.html';
    }
  })();
  </script>
</body>
</html>
