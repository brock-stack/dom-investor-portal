<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Deleted | Direct Off Market Investor Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/investor.css">
  <link rel="stylesheet" href="/css/glass.css">
  <script>
  (function() {
    var t = localStorage.getItem('dom_portal_theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
  </script>
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16.png">
  <link rel="apple-touch-icon" href="/img/favicon-32.png">
  <style>
    .logo-white { display: block; }
    .logo-dark  { display: none; }
    [data-theme="light"] .logo-white { display: none !important; }
    [data-theme="light"] .logo-dark  { display: block !important; }

    .deleted-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .deleted-card {
      background: var(--card, rgba(255,255,255,0.06));
      border: 1px solid var(--border, rgba(255,255,255,0.1));
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .deleted-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .deleted-heading {
      font-family: 'Barlow', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: var(--text, #fff);
      margin: 0 0 12px;
      line-height: 1.2;
    }
    .deleted-sub {
      font-size: 15px;
      color: var(--text-muted, #8a9bbf);
      margin: 0 0 8px;
      line-height: 1.6;
    }
    .deleted-support {
      font-size: 13px;
      color: var(--text-muted, #8a9bbf);
      margin: 0 0 32px;
    }
    .deleted-support a {
      color: #4fc3f7;
      text-decoration: none;
    }
    .deleted-support a:hover {
      text-decoration: underline;
    }
    .btn-home {
      display: inline-block;
      padding: 12px 28px;
      background: #4fc3f7;
      color: #0f172a;
      font-family: 'Barlow', sans-serif;
      font-size: 15px;
      font-weight: 700;
      border-radius: 10px;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn-home:hover {
      background: #38bdf8;
    }
  </style>
</head>
<body class="auth-page">
  <div class="scene s-dark"></div>
  <div class="scene s-light"></div>
  <div class="depth"></div>

  <div class="deleted-wrap">
    <div class="deleted-card">
      <div class="deleted-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>

      <h1 class="deleted-heading">Your account has been deleted.</h1>

      <p class="deleted-sub">You are signed out.</p>

      <p class="deleted-support">
        If you deleted by mistake, contact us at
        <a href="mailto:support@directoffmarket.com">support@directoffmarket.com</a>.
      </p>

      <a href="/homepage.html" class="btn-home">Back to homepage</a>
    </div>
  </div>
</body>
</html>
